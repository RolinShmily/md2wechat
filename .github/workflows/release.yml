name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('src/cli/package.json', 'utf8'));
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (pkg.version !== tag) {
              console.error('Tag ' + tag + ' does not match src/cli/package.json version ' + pkg.version);
              process.exit(1);
            }
            console.log('Version ' + pkg.version + ' matches tag.');
          "

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify package contents
        working-directory: src/cli
        run: npm pack --dry-run

      - name: Extract release notes from CHANGELOG
        run: node scripts/extract-changelog.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Pack release artifact
        working-directory: src/cli
        run: npm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            src/cli/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
