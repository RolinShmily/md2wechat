name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable npm Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const pkg = JSON.parse(fs.readFileSync('src/cli/package.json', 'utf8'));
            const tag = process.env.RELEASE_TAG.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(tag)) {
              console.error('Invalid tag: ' + process.env.RELEASE_TAG);
              process.exit(1);
            }
            if (pkg.version !== tag) {
              console.error('Tag ' + tag + ' does not match src/cli/package.json version ' + pkg.version);
              process.exit(1);
            }
            console.log('Version ' + pkg.version + ' matches tag.');
          "

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify package contents
        working-directory: src/cli
        run: npm pack --dry-run

      - name: Publish to npm (Trusted Publishing / OIDC)
        working-directory: src/cli
        run: npm publish --provenance --access public
